name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Opt-in flag for the slow boot-validation suite. Off by default so
    # the deploy path stays quick; flip on when you want the harness
    # tests to gate the deploy (regression hunts, CI dry-runs, etc.).
    inputs:
      run_harness_tests:
        description: 'Run boot + SIBO app-launch validation'
        type: boolean
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Native harness boot-validation ──────────────────────────────────────
      # Builds the platform-independent core (no Emscripten) and runs every
      # device listed in tests/devices.txt through the harness in --assert-boot
      # mode. Skipped by default to keep the deploy fast — opt in via the
      # workflow_dispatch input.

      - name: Build native harness
        if: ${{ inputs.run_harness_tests }}
        run: bash harness/build.sh

      - name: Run boot validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/boot/test-boot.sh --all

      # SIBO2 post-boot test: dismiss the cold-boot "Media is corrupt"
      # dialog with Esc and assert the System screen is what's on the LCD
      # at the end (rather than the dialog still being up, which is what
      # the user-reported "Media is corrupt" symptom looks like). Catches
      # regressions in the ASIC9 RAM-mirror / page-select decode that
      # surface as apps hitting KErrCorrupt when they touch M:.
      - name: Run SIBO app-launch validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-sibo-app-launch.sh --all

      # SIBO SSD packs: a pack is writable from the Psion only if the
      # Flash command interface and the ASIC5 address counter both behave
      # (see docs/sibo-ssd-packs.md). The boot gate can't see it — a pack
      # that mounts read-only boots identically — so drive the System
      # screen and check what the guest wrote back into the image. The
      # last case also reads a guest-written file back out through the
      # frontend's FEFS reader, which is what the pack browser's
      # per-file download depends on.
      - name: Run SIBO SSD write validation
        if: ${{ inputs.run_harness_tests }}
        run: |
          tests/unit/ssd_smoke
          bash tests/integration/test-ssd-write.sh

      # netpad MMC: the card comes up through the machine's own driver
      # stack (FPGA SPI port -> variant card-init state machine ->
      # medmmc.pdd -> peripheral bus -> F32), so a regression anywhere in
      # that chain shows up as drive D: going back to "Not present". The
      # boot gate can't see it — an empty slot boots identically.
      - name: Run netpad MMC card validation
        if: ${{ inputs.run_harness_tests }}
        run: |
          tests/unit/mmc_card_test
          bash tests/integration/test-netpad-mmc.sh

      # netpad audio: the machine's AC'97 codec hangs off the same board
      # FPGA as the card slot, and its ROM ships no recorder to drive it
      # from the UI, so check the microphone and speaker paths against
      # the register sequence the ROM's own sound PDD performs.
      - name: Run netpad audio validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-netpad-audio.sh

      # App-library 'epocdir' install: bundles that are an installed app
      # folder rather than a SIS are delivered by copying the folder onto
      # C: over the Remote Link, so nothing on the device confirms the
      # install for us the way a SIS installer's own prompts would. Drive
      # the real chain against the 5mx ROM — build the bundle, deliver
      # it, read every file back, then tap the app open and require it to
      # be on screen. The netpad runs the same EPOC catalogue but takes
      # its SIS installers by card, so the cable is the only road an
      # app-folder bundle has to it: the second run proves that road is
      # open (read-back only, no launch tap).
      - name: Run EPOC app-folder install validation
        if: ${{ inputs.run_harness_tests }}
        run: |
          bash tests/integration/test-epocdir-install.sh
          bash tests/integration/test-epocdir-install.sh --device netpad

      # App-library install on the netpad: the machine ships no
      # applications in ROM, so its "Install standard apps" button is the
      # only way to get any onto it — and it delivers over the MMC card
      # rather than the cable (the slot mounts as D: on its own, where
      # the link wants Remote link switched on by hand). Drive the whole
      # chain against the real netpad ROM: deliver a .SIS, run the
      # device's own installer, and require the app in Extras. Three
      # times — the machine's own CD set delivered app by app, a 3-Lib
      # EPOC game (which the netpad now takes as well), and the button's
      # own path: the whole CD set written onto ONE card and installed
      # off it, which is the case with nineteen installers in the root.
      - name: Run netpad app-library install validation
        if: ${{ inputs.run_harness_tests }}
        run: |
          bash tests/integration/test-netpad-app-install.sh
          bash tests/integration/test-netpad-app-install.sh epocgames/fred
          bash tests/integration/test-netpad-app-install.sh --standard-apps

      # EPOC machine ID: the debug panel reprograms the identity PROM at
      # runtime, which only means anything if the new ID is visible through
      # the bit-banged word reader the guest uses AND the image checksum is
      # re-folded (an unfolded image reads as corrupt and EPOC falls back to
      # its no-identity-chip defaults). Both are asserted through the
      # guest-side interface only.
      - name: Run EPOC machine-ID validation
        if: ${{ inputs.run_harness_tests }}
        run: tests/unit/machine_id_test

      # netBook keyboard: the boot gate can't see input, and the netBook OS
      # takes its keys through a synthetic kernel-event path that hides
      # whether the hardware works at all. Boot the ESHELL image — the same
      # machine running an EPOC build that path can't touch — and type at its
      # prompt, so the Eiger keyboard registers and the ROM's own ekeyb scan
      # are what get exercised.
      - name: Run netBook ESHELL keyboard validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-netbook-eshell-keyboard.sh

      # Geofox mouse pad: the boot gate can't see input, and this machine's
      # pointer is the one in the tree that has to be DERIVED — the pad
      # reports relative motion, so the emulator tracks a shadow of the
      # guest's own pointer to place an absolute host click. Drift there is
      # invisible in a screenshot until a click lands on the wrong icon, so
      # the test asserts on the reported press coordinates as well as on
      # Word opening.
      - name: Run Geofox mouse-pad validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-geofox-mouse.sh

      # Geofox language variant: the one ROM in the tree carrying two
      # languages, chosen at boot from a field in the settings PROM the
      # emulator synthesises. Both variants are English, so the desktop is
      # pixel-identical either way and a screenshot proves nothing — the
      # test boots each and reads out of RAM which resource files and
      # locale DLL the machine actually has open.
      - name: Run Geofox language-variant validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-geofox-language.sh

      # Siena locale: its ROM carries four (English (UK), English (USA),
      # Swedish, Spanish) and picks one from strap pins on ASIC9 port C,
      # which the emulator supplies. The System screen it boots to is the
      # same in all four, so the test boots each and checks which locale
      # block the kernel copied into RAM as its live country record.
      - name: Run Siena locale validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-siena-language.sh

      # The Conan ROM dumper: an ER5u binary this repo builds itself
      # (tools/e32 writes the E32Image container by hand), swapped into the
      # ROM and run on the machine, with the resulting six 2 MB parts read
      # back off the RAM disk. Guards both the container format and the
      # file-server ordinals it links against.
      - name: Run Conan ROM-dump validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-conan-romdump.sh

      # The same for EPOC Release 1: the Series 5 opens the dumper from
      # its own desktop and dumps its own 6 MB ROM to its RAM disk, and
      # the parts are checked against the ROM image from outside. Both
      # builds are run — the ordinary one, and the one with no import
      # table at all, which finds every call it makes in the machine's
      # own ROM and is the fallback for a machine that will not load the
      # first.
      - name: Run Series 5 ROM-dump validation
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-er1-romdump.sh

      - name: Run Series 5 ROM-dump validation (no-import build)
        if: ${{ inputs.run_harness_tests }}
        run: bash tests/integration/test-er1-romdump.sh --no-imports

      - name: Upload boot-validation artefacts
        if: ${{ inputs.run_harness_tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-validation
          path: |
            tests/logs/
            tests/results/
            tests/actual/

      # ── WASM build ──────────────────────────────────────────────────────────

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          # PINNED — do not use 'latest'. The toolchain resolving to a new
          # release under an unchanged repo shipped a broken site: deploys
          # built with Emscripten 6.0.2 (July 1-2) produce a psion.js whose
          # embind string returns throw 'TypeError: Type error' on
          # Safari/JSC, killing the device list (its first string call is
          # getAllDeviceProfilesJSON) and everything after it. 6.0.1 — the
          # June 29 deploy and all local validation — is known good on both
          # engines. Bump deliberately, and check the site on Safari/iOS as
          # well as Chrome when you do.
          version: 6.0.1
          actions-cache-folder: .emsdk-cache

      - name: Cache WASM object files
        uses: actions/cache@v4
        with:
          # The emsdk version is part of the key: objects compiled by one
          # compiler release must not be linked by another.
          path: wasm/obj
          key: wasm-obj-emsdk601-${{ hashFiles('core/**', 'wasm/main.cpp') }}

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      # ── MAME Series 3a bundle ────────────────────────────────────────────────
      # Download the pre-built psion3aweb.* files from the mame-3a-bundle
      # release (produced by the separate "Build MAME Series 3a Bundle"
      # workflow). If no release exists yet the step succeeds silently and
      # the mame-3a/index.html will show the "bundle not built" notice.

      - name: Download MAME Series 3a bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p frontend/public/mame-3a
          gh release download mame-3a-bundle \
            --repo ${{ github.repository }} \
            --dir frontend/public/mame-3a \
            --pattern "psion3aweb.*" 2>/dev/null \
            && echo "MAME bundle downloaded." \
            || echo "No mame-3a-bundle release found — Series 3a will show build instructions."

      # ── Frontend build ───────────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+: the app-library generator runs TypeScript directly via
          # --experimental-strip-types (it reuses the frontend's MBM
          # decoder for icon extraction).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Device lists outside the C++ registry: track.php's analytics
      # allowlist and the id → display-name map. Both fail silently when a
      # new machine is missing from them (rejected events that the client
      # swallows; a leaderboard row labelled with a raw id), so they are
      # checked rather than trusted. Cheap, and not gated on the harness
      # input — it is the frontend's own consistency.
      - name: Check device lists match the registry
        run: node --experimental-strip-types tests/unit/device-lists-sync.mts

      # tools/e32 writes EPOC32 binary containers by hand, so its idea of
      # the format is checked against a binary Psion's own tools produced:
      # D_EXC.exe out of the Conan ROM, whose checksums, import section and
      # relocation section it has to reproduce byte for byte.
      - name: Check the E32Image packer against the ROM's own binary
        run: node --experimental-strip-types tests/unit/e32-format.mts

      # The EPOC Release 1 ROM dumper (tools/romdump-er1). The first of
      # these compiles the dumper's own C for this machine against a
      # stand-in file server and a stand-in ROM, and puts it through a
      # full disk, a disk smaller than one part, a resumed dump and a
      # disk that gives back the wrong bytes. The second asks each R1 ROM
      # in the repository which EFSRV export is which, requires all three
      # to agree, runs the built binary through the checks R1's own
      # loader applies, and requires it to hold no instruction a Series
      # 5's ARMv3 CPU cannot execute. Running it on the machine itself is
      # the harness test further up.
      - name: Check the R1 ROM dumper's behaviour
        run: bash tests/unit/run-er1-romdump-test.sh

      - name: Check the R1 ROM dumper against the machines' own ROMs
        run: node --experimental-strip-types tests/unit/er1-romdump-image.mts

      - name: Build frontend
        run: bash scripts/build-frontend.sh

      # ── Copy ROMs into dist ──────────────────────────────────────────────────

      - name: Copy ROMs to dist
        run: |
          mkdir -p dist/roms
          cp -r roms/* dist/roms/

      # ── Generate the app library into dist ──────────────────────────────────
      # Converts the 3-Lib CD-ROM in applib/ into dist/apps:
      # manifest.json + one zip per app + extracted icons. Generated at
      # deploy time (never committed) — like the ROM copy above.

      - name: Build app library
        run: node --experimental-strip-types scripts/build-app-library.mts --out dist/apps

      # ── Copy device skins into dist ──────────────────────────────────────────

      - name: Copy skins to dist
        run: |
          mkdir -p dist/skins
          cp frontend/src/assets/skins/* dist/skins/ 2>/dev/null || true

      # ── FTP Deploy ───────────────────────────────────────────────────────────

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Only upload changed files (state file stored alongside dist)
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
