# Builds the native desktop apps for Windows, macOS and Linux (including the
# Raspberry Pi).
#
# Manual only. The artifacts are UNSIGNED by decision — getting the app right
# comes first, and notarisation needs certificates in the repo before any of it
# can be verified — so a download here is something you run past your own OS's
# warning, not something that installs quietly.
#
# Shape of it: one Linux job builds the WASM engine and hands it on, the pure
# tests run beside it, and then ONE JOB PER PLATFORM picks that engine up,
# packages around it and uploads its installers straight to the release
# (.github/workflows/desktop-package.yml, called once per platform).
# Building WASM inside each platform job would pay for the Emscripten toolchain
# twice and, worse, could produce two subtly different engines in one release.
#
# The per-platform jobs are separate rather than a matrix on purpose: a
# job-level `if` cannot read the `matrix` context — it is evaluated before the
# matrix expands — so "build only mac" was not expressible that way. It is the
# error this file used to fail to parse with.
#
# Nothing here is a workflow ARTIFACT. Artifacts in this private repo count
# against the account's Actions storage quota, and one run of this workflow
# used to put ~2 GB of installers there for two weeks — enough to exhaust the
# quota and fail every later upload, the small engine included ("Artifact
# storage quota has been hit"). So the engine travels by actions/cache (its own
# per-repo allowance, not the artifact quota) and the installers go straight to
# a release, which costs no Actions storage at all.
#
# Where they go: `desktop-latest` in the PUBLIC mirror, joehaines/psionEmulators,
# which is where the website's download buttons point. Not this repository —
# it is private, and a private repo's release assets are a 404 to anyone not
# signed in with access to it, i.e. to every visitor of the site.

name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options: [all, mac, win, linux]
      publish:
        description: >-
          Publish to the public desktop-latest release (what the site links
          to). Off means they go to a desktop-preview prerelease in this
          private repo instead, downloadable only by someone with access.
        type: boolean
        default: true

jobs:
  # ── The emulator engine, built once ──────────────────────────────────────
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          # PINNED, for the same reason deploy.yml pins it: 6.0.2 produces a
          # psion.js whose embind string returns throw on Safari/JSC. The
          # desktop app runs on Chromium so it would not hit that, but building
          # the desktop engine with a different compiler from the web one is a
          # good way to end up debugging a difference that is not in this repo.
          version: 6.0.1
          actions-cache-folder: .emsdk-cache

      - name: Cache WASM object files
        uses: actions/cache@v4
        with:
          path: wasm/obj
          key: wasm-obj-emsdk601-${{ hashFiles('core/**', 'wasm/main.cpp') }}

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      # By cache, not artifact — see the top of this file. The key is unique to
      # the run, so a packaging job can only ever pick up the engine built by
      # its own run. enableCrossOsArchive because the restore happens on macOS
      # and Windows runners, which by default refuse a cache saved on Linux.
      # The path list must stay identical to the restore in
      # desktop-package.yml: it is part of what the cache is matched on.
      - name: Hand the engine to the packaging jobs
        uses: actions/cache/save@v4
        with:
          path: |
            frontend/public/psion.js
            frontend/public/psion.wasm
          key: psion-wasm-run-${{ github.run_id }}
          enableCrossOsArchive: true

  # ── Pure tests, before spending runner minutes on packaging ──────────────
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - name: Frontend desktop suites
        run: npm run test:desktop
        working-directory: frontend
      - name: Main-process suites
        # Only the ones that need no display: the Electron gates run inside the
        # packaging jobs, where a packaged app already exists to point them at.
        run: |
          npm ci
          npm run test:aspect
          npm run test:hostfs
          npm run test:offline
        working-directory: desktop

  # ── The release the installers go into ───────────────────────────────────
  # A single rolling release, `desktop-latest`, holding one installer per
  # platform under a stable filename. The site links straight at those URLs, so
  # they must not move when the version bumps — hence --clobber onto a fixed
  # tag rather than a release per version.
  #
  # Made (or its notes refreshed) here, before any packaging job, because each
  # of those uploads its own installers into it as soon as it has them. A
  # one-platform run therefore replaces that platform's files and leaves the
  # others' in place.
  #
  # PUBLIC_MIRROR_TOKEN is the fine-grained PAT sync-public.yml already uses
  # for joehaines/psionEmulators; its Contents: read and write is what
  # creating a release and uploading assets there needs.
  release:
    needs: [wasm, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      repo: ${{ steps.where.outputs.repo }}
      tag: ${{ steps.where.outputs.tag }}
    steps:
      - name: Create or refresh the release
        id: where
        env:
          PUBLISH: ${{ inputs.publish }}
          MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "$PUBLISH" = "true" ]; then
            if [ -z "$MIRROR_TOKEN" ]; then
              echo "::error::PUBLIC_MIRROR_TOKEN is not set. Publishing goes to" \
                   "joehaines/psionEmulators, which GITHUB_TOKEN cannot write to."
              exit 1
            fi
            repo=joehaines/psionEmulators tag=desktop-latest prerelease=
            export GH_TOKEN="$MIRROR_TOKEN"
          else
            repo="$GITHUB_REPOSITORY" tag=desktop-preview prerelease=--prerelease
            export GH_TOKEN="$REPO_TOKEN"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          cat > notes.md <<'NOTES'
          The Psion emulator as a native app: one window that is nothing but the
          machine, with its state saved to disk, a shared card folder and a
          folder synced over the emulated Remote Link cable.

          - **macOS** — `Psion-Emulator-macOS-arm64.dmg` (Apple silicon)
          - **Windows** — `Psion-Emulator-Windows-x64-Setup.exe`
          - **Linux** — `Psion-Emulator-Linux-x64.AppImage`, or
            `Psion-Emulator-Linux-x64.deb` on Debian/Ubuntu
          - **Raspberry Pi** (64-bit Pi OS, Pi 4 or later) —
            `Psion-Emulator-Linux-arm64.deb`, installed with
            `sudo apt install ./Psion-Emulator-Linux-arm64.deb`. The
            `.tar.gz` is the same app for any other arm64 Linux, or for a Pi
            where you would rather not install anything: untar it, `cd` in,
            and run `./psion-emulator-desktop` (see the README if it
            complains about the SUID sandbox).

          These builds are **unsigned**, so the OS will warn about them:
          on macOS open the app from its right-click menu the first time,
          on Windows choose *More info → Run anyway*. Linux does not warn —
          mark the AppImage executable (`chmod +x`) and run it.

          The app works with no network connection: the ROMs, the engine and
          every asset are inside the download.

          Rolling release — the files are replaced in place by each build, so
          the download links keep working.
          NOTES
          if [ -n "$prerelease" ]; then
            printf '\n**Preview build** — not what the site links to.\n' >> notes.md
          fi

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" $prerelease \
              --title "Psion Emulator — desktop apps" \
              --notes-file notes.md
          else
            gh release edit "$tag" --repo "$repo" --notes-file notes.md
          fi

  # ── The apps themselves, one job each ────────────────────────────────────

  mac:
    needs: [wasm, tests, release]
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'mac' }}
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      target: mac
      runner: macos-14
      wasm-cache-key: psion-wasm-run-${{ github.run_id }}
      release-repo: ${{ needs.release.outputs.repo }}
      release-tag: ${{ needs.release.outputs.tag }}

  win:
    needs: [wasm, tests, release]
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'win' }}
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      target: win
      runner: windows-2022
      wasm-cache-key: psion-wasm-run-${{ github.run_id }}
      release-repo: ${{ needs.release.outputs.repo }}
      release-tag: ${{ needs.release.outputs.tag }}

  # One job for both Linux architectures. Unlike mac and win, the runner does
  # not decide what is built: an x64 runner produces the arm64 Raspberry Pi
  # packages too, because nothing in the app is compiled per-arch —
  # electron-builder pairs the same JavaScript with a different prebuilt
  # Electron. The packaged-app smoke test can only launch the x64 one.
  linux:
    needs: [wasm, tests, release]
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    uses: ./.github/workflows/desktop-package.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      target: linux
      runner: ubuntu-latest
      wasm-cache-key: psion-wasm-run-${{ github.run_id }}
      release-repo: ${{ needs.release.outputs.repo }}
      release-tag: ${{ needs.release.outputs.tag }}

