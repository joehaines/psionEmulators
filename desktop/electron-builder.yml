productName: Psion Emulator
copyright: © 2024-2026 Joe Haines

directories:
  output: dist
  buildResources: resources

# Only the built output ships. src/ and test/ are not in the app.
files:
  - build/main/**
  - build/renderer/**
  - package.json

asar: true

# ROMs live OUTSIDE the app archive, served from a directory by the app://
# handler (see src/main/protocol.ts, which resolves them from
# process.resourcesPath when packaged). Two reasons: they are ~200 MB, and
# there is no point paying asar indirection on a file the protocol handler
# streams straight off disk.
#
# Worth a deliberate look before shipping: bundling ROM dumps into a
# redistributable binary is a different proposition from serving them from
# your own site, which is what NOTICE.md currently describes. The protocol
# handler already prefers a directory, so a lazy-download variant is a small
# change if that posture is not wanted.
#
# Only the folders the default ROMs live in: roms/ also carries the whole
# Psion-ROM archive (~700 MB of alternate builds), which only the website's
# Settings > ROM versions can choose between — the desktop app has no
# Settings view, so it always boots the defaults. The list is checked
# against the registry and romCatalog by tests/unit/rom-catalog-sync.mts.
extraResources:
  - from: ../roms
    to: roms
    filter:
      - 'Conan/Conan_v0.01(22)_engbuild/**'
      - 'Conan/Conan_v0.10(17)_eng/**'
      - 'Geofox/Geofox_v1.01(146)_eng/**'
      - 'HC120/hc120_v1.72F_eng/**'
      - 'MC200/MC200_v2.12F_eng/**'
      - 'MC218/MC218_v1.05(259)_eng/**'
      - 'MC400/MC400_v1.26F_eng/**'
      - 'MC400/MC400_v2.60F_eng/**'
      - 'Organiser1/Organiser1_eng/**'
      - 'OrganiserII/OrganiserII_LZ64_eng/**'
      - 'Osaris/Osaris_v1.02(209)_eng/**'
      - 'Revo/Revo_v1.06(390)_eng/**'
      - 'Series3/pb_v1.91f_acn/**'
      - 'Series3/s3_v1.91f_eng/**'
      - 'Series3a/pb2_v1.30f_acn/**'
      - 'Series3a/s3a_v3.40f_eng/**'
      - 'Series3c/oak_v5.20f_eng/**'
      - 'Series3mx/maple_v6.16f_eng/**'
      - 'Series5/S5_v1.01(145)_eng/**'
