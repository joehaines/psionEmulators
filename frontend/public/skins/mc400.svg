<?xml version="1.0" encoding="UTF-8"?>
<!--
  Psion MC400 placeholder skin. Clamshell laptop body (1989) with the
  640x400 LCD anchored at the top. Dimensions are in arbitrary SVG
  units; the EmulatorView SKIN_LAYOUTS entry maps the screen rect into
  fractional coordinates so the layout scales with the container.

  ViewBox 800 x 600:
    LCD cutout at (80, 60) sized 640 x 400 (the panel itself).
    Bezel ring around the panel (~12 unit gutter).
    Hinge strip below the bezel at y ≈ 470.
    Keyboard area below the hinge filling y 480..580 — drawn as a
    flat textured rectangle (not interactive; the host browser
    keyboard supplies the actual keystrokes).

  Replace with proper artwork later — the layout entry will keep
  pointing at the screen rect inside the SVG so swapping the file
  doesn't require code changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <!-- Body / clamshell shell -->
  <rect x="0" y="0" width="800" height="600" rx="18" ry="18" fill="#2d2a26"/>

  <!-- Top lid bezel surrounding the LCD -->
  <rect x="60" y="40" width="680" height="440" rx="8" ry="8" fill="#1a1815"/>

  <!-- LCD panel cutout (this is where the framebuffer is rendered) -->
  <rect x="80" y="60" width="640" height="400" fill="#000000"/>

  <!-- Hinge strip -->
  <rect x="60" y="478" width="680" height="6" fill="#0e0d0b"/>

  <!-- Keyboard area placeholder -->
  <rect x="60" y="492" width="680" height="92" rx="4" ry="4" fill="#3b3733"/>

  <!-- Faint key-row texture so the keyboard area reads as a keyboard -->
  <g fill="#2d2a26" opacity="0.6">
    <rect x="80" y="502" width="640" height="14" rx="2" ry="2"/>
    <rect x="80" y="522" width="640" height="14" rx="2" ry="2"/>
    <rect x="80" y="542" width="640" height="14" rx="2" ry="2"/>
    <rect x="80" y="562" width="640" height="14" rx="2" ry="2"/>
  </g>

  <!-- Psion "MC400" wordmark on the bezel -->
  <text x="400" y="32" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="bold" fill="#a8a39a"
        letter-spacing="3">PSION MC400</text>
</svg>
