<?xml version="1.0" encoding="UTF-8"?>
<!--
  Psion Organiser II placeholder skin. ViewBox sized for the LZ form
  factor: physical ratio ~140 x 84 mm, LCD pane ~55 x 22 mm centred
  near the top. Final art will replace this with proper case +
  silkscreen + alphabetical 6x6 keypad mockup; for now this just
  carves a dark LCD pane out of a charcoal body so the canvas anchors
  in the right place.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="lcdPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4030"/>
      <stop offset="1" stop-color="#2a3020"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="0" y="0" width="700" height="420" rx="32" ry="32" fill="url(#case)"/>
  <!-- Bezel ring around the LCD -->
  <rect x="100" y="40" width="500" height="160" rx="8" ry="8" fill="#101010"/>
  <!-- LCD pane (canvas anchors here via the SKIN_LAYOUTS fractions) -->
  <rect x="110" y="50" width="480" height="140" fill="url(#lcdPane)"/>
  <!-- Keypad placeholder (6x6 grid hint, no labels in scaffold) -->
  <g fill="#222" stroke="#0a0a0a" stroke-width="1">
    <!-- 6 rows x 6 columns of 70 x 36 cells, gap 4 -->
    <g>
      <rect x="50"  y="230" width="80" height="28" rx="4"/>
      <rect x="140" y="230" width="80" height="28" rx="4"/>
      <rect x="230" y="230" width="80" height="28" rx="4"/>
      <rect x="320" y="230" width="80" height="28" rx="4"/>
      <rect x="410" y="230" width="80" height="28" rx="4"/>
      <rect x="500" y="230" width="80" height="28" rx="4"/>
    </g>
    <g>
      <rect x="50"  y="265" width="80" height="28" rx="4"/>
      <rect x="140" y="265" width="80" height="28" rx="4"/>
      <rect x="230" y="265" width="80" height="28" rx="4"/>
      <rect x="320" y="265" width="80" height="28" rx="4"/>
      <rect x="410" y="265" width="80" height="28" rx="4"/>
      <rect x="500" y="265" width="80" height="28" rx="4"/>
    </g>
    <g>
      <rect x="50"  y="300" width="80" height="28" rx="4"/>
      <rect x="140" y="300" width="80" height="28" rx="4"/>
      <rect x="230" y="300" width="80" height="28" rx="4"/>
      <rect x="320" y="300" width="80" height="28" rx="4"/>
      <rect x="410" y="300" width="80" height="28" rx="4"/>
      <rect x="500" y="300" width="80" height="28" rx="4"/>
    </g>
    <g>
      <rect x="50"  y="335" width="80" height="28" rx="4"/>
      <rect x="140" y="335" width="80" height="28" rx="4"/>
      <rect x="230" y="335" width="80" height="28" rx="4"/>
      <rect x="320" y="335" width="80" height="28" rx="4"/>
      <rect x="410" y="335" width="80" height="28" rx="4"/>
      <rect x="500" y="335" width="80" height="28" rx="4"/>
    </g>
    <g>
      <rect x="50"  y="370" width="80" height="28" rx="4"/>
      <rect x="140" y="370" width="80" height="28" rx="4"/>
      <rect x="230" y="370" width="80" height="28" rx="4"/>
      <rect x="320" y="370" width="80" height="28" rx="4"/>
      <rect x="410" y="370" width="80" height="28" rx="4"/>
      <rect x="500" y="370" width="80" height="28" rx="4"/>
    </g>
  </g>
  <text x="600" y="30" fill="#888" font-family="monospace" font-size="14">PSION</text>
</svg>
