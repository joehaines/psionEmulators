<?xml version="1.0" encoding="UTF-8"?>
<!--
  Oregon Scientific Osaris skin — placeholder.

  Renders the 440 × 200 digitiser pad only; no surrounding device body.
  The pad coordinate system this file commits to (and that EmulatorView's
  SkinLayout for osaris.svg mirrors):

    viewBox            : 0 0 440 200       (= digitiser pixels)
    LCD                : (60, 0)  320 × 200
    Left silkscreen    : (0,  0)  60  × 200 (icon column)
    Right silkscreen   : (380,0)  60  × 200 (icon column)

  These match the dimensions reported by CLPS7111::Emulator (and the
  upstream WindEmu Osaris config). When this skin is replaced with
  artwork that includes the device body, both the SVG viewBox and the
  digitiserPad{Left,Top,Width,Height} fractions in SKIN_LAYOUTS need
  to be updated together so taps still land 1:1 on the digitiser.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 440 200"
     width="100%" height="100%"
     shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#b4b4b4"/>
      <stop offset="0.5" stop-color="#969696"/>
      <stop offset="1"   stop-color="#787878"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e11"/>
      <stop offset="1" stop-color="#141a1e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="440" height="200" fill="url(#silk)"/>
  <rect x="60" y="0" width="320" height="200" fill="url(#screen)"/>

  <line x1="60"  y1="0" x2="60"  y2="200" stroke="#1a2128" stroke-width="0.6"/>
  <line x1="380" y1="0" x2="380" y2="200" stroke="#1a2128" stroke-width="0.6"/>
</svg>
