<?xml version="1.0" encoding="UTF-8"?>
<!--
  Psion Revo / Revo Plus skin — placeholder.

  Renders the 527 × 208 digitiser pad only; no surrounding device body.
  This file is intentionally minimal because the user is going to replace
  it with proper hand-drawn artwork. What needs to stay constant for that
  replacement to slot in cleanly is the **pad coordinate system**:

    viewBox            : 0 0 527 208       (= digitiser pixels)
    LCD                : (47, 0)  480 × 160
    Left silkscreen    : (0,  0)  47  × 160 (Menu / Copy / Infrared
                                             / Zoom +/−)
    Bottom silkscreen  : (0,160)  527 × 48  (System / Contacts / Agenda
                                             / Email / Phone / Time / Calc
                                             / Jotter / Extras)

  These match the Revo's Machine Information report (Pointer resolution
  527 × 208 around a 480 × 160 LCD). EmulatorView's SkinLayout for
  revo.svg uses the same fractions, so taps land 1:1 on the digitiser
  surface the EPOC pen driver expects. When this skin is replaced with
  artwork that includes the device body, both the SVG viewBox and the
  digitiserPad{Left,Top,Width,Height} fractions in SKIN_LAYOUTS need
  to be updated together.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 527 208"
     width="100%" height="100%"
     shape-rendering="geometricPrecision">
  <defs>
    <!-- Silkscreen pad surface — neutral grey, no warm tint. -->
    <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#b4b4b4"/>
      <stop offset="0.5" stop-color="#969696"/>
      <stop offset="1"   stop-color="#787878"/>
    </linearGradient>
    <!-- LCD rest state. -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e11"/>
      <stop offset="1" stop-color="#141a1e"/>
    </linearGradient>
  </defs>

  <!-- Pad surface (silkscreen). -->
  <rect x="0" y="0" width="527" height="208" fill="url(#silk)"/>

  <!-- LCD recess — the WASM canvas paints over this rect. -->
  <rect x="47" y="0" width="480" height="160" fill="url(#screen)"/>

  <!-- Hairlines marking the LCD edges against the silkscreen. -->
  <line x1="47" y1="0"   x2="47"  y2="160" stroke="#1a2128" stroke-width="0.6"/>
  <line x1="0"  y1="160" x2="527" y2="160" stroke="#1a2128" stroke-width="0.6"/>

  <!-- Left silkscreen column placeholder icons. ~10 px wide markers
       (~30 % of the 47-px column) centred at x=23. -->
  <g fill="none" stroke="#1c2227" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Menu (three bars) — y=16 -->
    <g transform="translate(23, 16)">
      <line x1="-5" y1="-3" x2="5" y2="-3"/>
      <line x1="-5" y1="0"  x2="5" y2="0"/>
      <line x1="-5" y1="3"  x2="5" y2="3"/>
    </g>
    <!-- Copy (two pages) — y=48 -->
    <g transform="translate(23, 48)">
      <rect x="-4" y="-4" width="6" height="8"/>
      <rect x="-2" y="-2" width="6" height="8" fill="url(#silk)"/>
    </g>
    <!-- Infrared — y=80 -->
    <g transform="translate(23, 80)">
      <path d="M -1 3 a 3 3 0 0 1 0 -6"/>
      <path d="M -3 5 a 5 5 0 0 1 0 -10"/>
      <circle cx="-2" cy="0" r="0.9" fill="#1c2227"/>
    </g>
    <!-- Zoom in — y=112 -->
    <g transform="translate(23, 112)">
      <circle cx="-1" cy="-1" r="3"/>
      <line x1="1" y1="1" x2="4" y2="4"/>
      <line x1="-3" y1="-1" x2="1" y2="-1"/>
      <line x1="-1" y1="-3" x2="-1" y2="1"/>
    </g>
    <!-- Zoom out — y=144 -->
    <g transform="translate(23, 144)">
      <circle cx="-1" cy="-1" r="3"/>
      <line x1="1" y1="1" x2="4" y2="4"/>
      <line x1="-3" y1="-1" x2="1" y2="-1"/>
    </g>
  </g>

  <!-- Bottom silkscreen strip — 9 markers across the FULL pad width.
       Column = 527/9 ≈ 58.6, centred vertically at y=184. -->
  <g fill="none" stroke="#1c2227" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(29.3, 184)"> <!-- System -->
      <rect x="-5" y="-5" width="10" height="7"/>
      <line x1="-6" y1="4" x2="6" y2="4"/>
    </g>
    <g transform="translate(87.9, 184)"> <!-- Contacts -->
      <circle cx="0" cy="-3" r="2.2"/>
      <path d="M -5 5 a 5 4 0 0 1 10 0"/>
    </g>
    <g transform="translate(146.6, 184)"> <!-- Agenda -->
      <rect x="-5" y="-5" width="10" height="9"/>
      <line x1="-5" y1="-2" x2="5" y2="-2"/>
    </g>
    <g transform="translate(205.2, 184)"> <!-- Email -->
      <rect x="-5" y="-3" width="10" height="8"/>
      <path d="M -5 -3 L 0 1 L 5 -3"/>
    </g>
    <g transform="translate(263.8, 184)"> <!-- Phone -->
      <path d="M -4 -4 q 0 4 3 7 q 3 3 7 3 l 0 -2 l -2 -2 l -2 1 l -3 -3 l 1 -2 l -2 -2 z"/>
    </g>
    <g transform="translate(322.4, 184)"> <!-- Time -->
      <circle cx="0" cy="0" r="4"/>
      <line x1="0" y1="0" x2="0" y2="-3"/>
      <line x1="0" y1="0" x2="3" y2="1"/>
    </g>
    <g transform="translate(381.1, 184)"> <!-- Calc -->
      <rect x="-5" y="-5" width="10" height="10"/>
      <text y="2" font-size="6" font-family="Arial, sans-serif" stroke="none"
            fill="#1c2227" text-anchor="middle" font-weight="bold">123</text>
    </g>
    <g transform="translate(439.7, 184)" fill="#1c2227"> <!-- Jotter -->
      <path d="M -4 4 L 0 -1 L 3 -5 L 5 -3 L 1 1 L -3 5 Z"/>
    </g>
    <g transform="translate(498.3, 184)" fill="#1c2227" stroke="none"> <!-- Extras -->
      <circle cx="-4" cy="0" r="1.3"/>
      <circle cx="0"  cy="0" r="1.3"/>
      <circle cx="4"  cy="0" r="1.3"/>
    </g>
  </g>
</svg>
