<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet">
  <!-- Psion Series 7 clamshell, placeholder skin. Real device is a
       pale silver netbook-style enclosure with a 640x480 TFT panel
       and integrated QWERTY keyboard. This placeholder is a neutral
       bezel that boxes the LCD area; a detailed skin can replace it
       without changing the emulator bindings. -->
  <rect x="0" y="0" width="800" height="560" fill="#b8bbc0"/>
  <rect x="60" y="30" width="680" height="500" rx="18" fill="#2a2d31"/>
  <!-- LCD cutout: 640x480 centred -->
  <rect x="80" y="40" width="640" height="480" fill="#000000"/>
  <text x="400" y="545" text-anchor="middle" font-family="sans-serif"
        font-size="14" fill="#30333a">Psion Series 7</text>
</svg>
