<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet">
  <!-- Psion Workabout / WorkaboutMX (1995 / 2000) — placeholder skin.
       The real device is a chunky industrial handheld with a rugged
       grey/black bezel, a tall numeric/F-key column, and a 240x100
       LCD set high in the body. This placeholder is a neutral bezel
       that boxes the LCD area at 2x scale (480x200) so the framebuffer
       reads cleanly in the in-browser selector; a detailed skin can
       replace it without changing the emulator bindings. Same skin
       serves both the Workabout and the WorkaboutMX (identical form
       factor — only the silkscreen text changes between models). -->
  <rect x="0" y="0" width="480" height="320" fill="#3c4040"/>
  <rect x="20" y="20" width="440" height="240" rx="14" fill="#1d1f20"/>
  <!-- LCD cutout: 240x100 panel scaled 2x to 480x200, centred. -->
  <rect x="40" y="40" width="400" height="200" fill="#9eb89a"/>
  <text x="240" y="295" text-anchor="middle" font-family="sans-serif"
        font-size="14" fill="#cfd2d4">PSION WORKABOUT</text>
</svg>
