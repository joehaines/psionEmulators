<h2 align="center">Adding appointments & reminders.</h2>
<br><br>
<p>Calendar has a number of entries for appointments and reminders:
</p><ul>
<li>Timed day entries for appointments that you wish to 
  give a duration, e.g. a meeting or dental 
  appointment. 

<li>Untimed day entries for a reminder without a duration.
