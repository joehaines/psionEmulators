<h2 align="center">The home page.</h2>
<br><br><p>
Important default keypresses are:<p>
<table border="1">
  <tbody>
    <tr>
      <td>Add bookmark</td>
      <td>CTRL+D</td>
    </tr>
    <tr>
      <td>Back</td>
      <td>backspace</td>
    </tr>
    <tr>
      <td>Bookmarks</td>
      <td>CTRL+B</td>
    </tr>
    <tr>
      <td>Close window</td>
      <td>CTRL+SHIFT+W</td>
    </tr>
    <tr>
      <td>Downloads</td>
      <td>CTRL+J</td>
    </tr>
    <tr>
      <td>Find in this page</td>
      <td>CTRL+F</td>
    </tr>
    <tr>
      <td>Forward </td>
      <td>SHIFT+backspace</td>
    </tr>
    <tr>
      <td>History</td>
      <td>CTRL+H</td>
    </tr>
    <tr>
      <td>Open File</td>
      <td>CTRL+O</td>
    </tr>
    <tr>
      <td>Print</td>
      <td>CTRL+P</td>
    </tr>
  </tbody>
</table>
